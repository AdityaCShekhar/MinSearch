spring.application.name=minsearch-search
minsearch.audit.table=search_security_audit
minsearch.deployment.mode=${MINSEARCH_DEPLOYMENT_MODE:development}
minsearch.security.jwt.previous-secret=${MINSEARCH_SECURITY_JWT_PREVIOUS_SECRET:}
server.forward-headers-strategy=none
minsearch.cache.redis.enabled=${MINSEARCH_CACHE_REDIS_ENABLED:false}
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms
management.health.redis.enabled=false
spring.datasource.url=${MINSEARCH_DATABASE_URL:jdbc:postgresql://localhost:5434/minsearch_search}
spring.datasource.username=${MINSEARCH_DATABASE_USERNAME:minsearch_search}
spring.datasource.password=${MINSEARCH_DATABASE_PASSWORD:minsearch_search_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.table=search_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus

minsearch.storage.documents-root=${MINSEARCH_STORAGE_DOCUMENTS_ROOT:${java.io.tmpdir}/minsearch/documents}
minsearch.security.resource-server.enabled=true
minsearch.security.jwt.secret=${MINSEARCH_SECURITY_JWT_SECRET:local-only-change-this-minsearch-secret-key}
minsearch.messaging.enabled=${MINSEARCH_MESSAGING_ENABLED:false}
spring.kafka.bootstrap-servers=${MINSEARCH_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

management.endpoint.health.group.readiness.include=readinessState,db,index
management.endpoint.health.group.liveness.include=livenessState

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=25s
spring.kafka.listener.immediate-stop=true
spring.kafka.listener.poll-timeout=1s
