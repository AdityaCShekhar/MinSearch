spring.application.name=minsearch-document
minsearch.audit.table=document_security_audit
minsearch.deployment.mode=${MINSEARCH_DEPLOYMENT_MODE:development}
minsearch.security.jwt.previous-secret=${MINSEARCH_SECURITY_JWT_PREVIOUS_SECRET:}
server.forward-headers-strategy=none
server.port=8080
spring.datasource.url=${MINSEARCH_DATABASE_URL:jdbc:postgresql://localhost:5433/minsearch_document}
spring.datasource.username=${MINSEARCH_DATABASE_USERNAME:minsearch_document}
spring.datasource.password=${MINSEARCH_DATABASE_PASSWORD:minsearch_document_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.table=document_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

minsearch.storage.documents-root=${MINSEARCH_STORAGE_DOCUMENTS_ROOT:${java.io.tmpdir}/minsearch/documents}
minsearch.storage.index-root=${MINSEARCH_STORAGE_INDEX_ROOT:${java.io.tmpdir}/minsearch/index}
minsearch.documents.max-size-bytes=${MINSEARCH_DOCUMENTS_MAX_SIZE_BYTES:10485760}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=%property{spring.application.name} correlationId=%X{correlationId:-} module=%logger{36} message=%msg%n

minsearch.security.resource-server.enabled=true
minsearch.security.jwt.secret=${MINSEARCH_SECURITY_JWT_SECRET:local-only-change-this-minsearch-secret-key}
minsearch.messaging.enabled=${MINSEARCH_MESSAGING_ENABLED:false}
spring.kafka.bootstrap-servers=${MINSEARCH_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

management.endpoint.health.group.readiness.include=readinessState,db,storage
management.endpoint.health.group.liveness.include=livenessState

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=25s
spring.kafka.listener.immediate-stop=true
spring.kafka.listener.poll-timeout=1s
