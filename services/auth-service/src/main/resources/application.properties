spring.application.name=minsearch
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${MINSEARCH_DATABASE_URL:jdbc:postgresql://localhost:5432/minsearch}
spring.datasource.username=${MINSEARCH_DATABASE_USERNAME:postgres}
spring.datasource.password=${MINSEARCH_DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

minsearch.security.jwt.secret=${MINSEARCH_SECURITY_JWT_SECRET:local-only-change-this-minsearch-secret-key}

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus

server.forward-headers-strategy=framework
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=%property{spring.application.name} correlationId=%X{correlationId:-} module=%logger{36} message=%msg%n
