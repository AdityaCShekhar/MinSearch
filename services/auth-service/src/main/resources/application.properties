spring.application.name=minsearch
minsearch.audit.table=auth_security_audit
minsearch.deployment.mode=${MINSEARCH_DEPLOYMENT_MODE:development}
minsearch.security.jwt.previous-secret=${MINSEARCH_SECURITY_JWT_PREVIOUS_SECRET:}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${MINSEARCH_DATABASE_URL:jdbc:postgresql://localhost:5432/minsearch_auth}
spring.datasource.username=${MINSEARCH_DATABASE_USERNAME:minsearch_auth}
spring.datasource.password=${MINSEARCH_DATABASE_PASSWORD:minsearch_auth_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

minsearch.security.jwt.secret=${MINSEARCH_SECURITY_JWT_SECRET:local-only-change-this-minsearch-secret-key}

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus

server.forward-headers-strategy=none
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=%property{spring.application.name} correlationId=%X{correlationId:-} module=%logger{36} message=%msg%n

management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=25s
spring.kafka.listener.immediate-stop=true
spring.kafka.listener.poll-timeout=1s
