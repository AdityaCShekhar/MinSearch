name: minsearch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minsearch}
      POSTGRES_USER: ${POSTGRES_USER:-minsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minsearch_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minsearch} -d ${POSTGRES_DB:-minsearch}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in document.uploaded document.updated document.deleted index.completed index.failed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic.DLT" --partitions 3 --replication-factor 1
        done

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-minsearch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-minsearch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-minsearch_dev_password}
      MINSEARCH_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-minsearch}
      MINSEARCH_DATABASE_USERNAME: ${POSTGRES_USER:-minsearch}
      MINSEARCH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-minsearch_dev_password}
      MINSEARCH_SECURITY_JWT_SECRET: ${MINSEARCH_SECURITY_JWT_SECRET:-local-only-change-this-minsearch-secret-key}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AUTH_PORT:-8081}:8080"

  document-service:
    build:
      context: ../../
      dockerfile: services/document-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-minsearch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-minsearch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-minsearch_dev_password}
      MINSEARCH_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-minsearch}
      MINSEARCH_DATABASE_USERNAME: ${POSTGRES_USER:-minsearch}
      MINSEARCH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-minsearch_dev_password}
      MINSEARCH_SECURITY_JWT_SECRET: ${MINSEARCH_SECURITY_JWT_SECRET:-local-only-change-this-minsearch-secret-key}
      MINSEARCH_MESSAGING_ENABLED: "true"
      MINSEARCH_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINSEARCH_STORAGE_DOCUMENTS_ROOT: /data/documents
    volumes:
      - documents-data:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${DOCUMENT_PORT:-8082}:8080"

  search-service:
    build:
      context: ../../
      dockerfile: services/search-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-minsearch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-minsearch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-minsearch_dev_password}
      MINSEARCH_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-minsearch}
      MINSEARCH_DATABASE_USERNAME: ${POSTGRES_USER:-minsearch}
      MINSEARCH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-minsearch_dev_password}
      MINSEARCH_SECURITY_JWT_SECRET: ${MINSEARCH_SECURITY_JWT_SECRET:-local-only-change-this-minsearch-secret-key}
      MINSEARCH_MESSAGING_ENABLED: "true"
      MINSEARCH_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINSEARCH_STORAGE_DOCUMENTS_ROOT: /data/documents
    volumes:
      - documents-data:/data/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${SEARCH_PORT:-8083}:8080"

volumes:
  postgres-data:
  kafka-data:
  documents-data:
